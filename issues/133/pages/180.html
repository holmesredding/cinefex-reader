<style>html,body{margin:0!important;padding:0!important;width:1024px!important;height:768px!important;overflow:hidden!important;}page{display:block!important;width:1024px!important;height:768px!important;position:relative;margin:0!important;}.imageGalleryPage{background-size:1024px 768px!important;}a:focus-visible{outline:3px solid #a6382b;outline-offset:3px;}</style><body><page><img data-media-src="https://archive.org/download/cinefex_2013/CineFex%20Magazine%202013%2C%20No.%20132-135/CineFex%202013%20No%20133.zip/images%2FCinefex-133-p66.21-JACK.png" style="position:absolute;left:0px;top:0px;width:1024px;height:768px" data-dark-text="true"></page><script>window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.cinefexNavigate)location.replace(e.data.cinefexNavigate);if(e.data?.cinefexHighlight){const r=e.data.cinefexHighlight;let h=document.getElementById('reader-highlight');if(h)h.remove();h=document.createElement('div');h.id='reader-highlight';h.style.cssText='position:absolute;pointer-events:none;border:3px solid #a6382b;box-sizing:border-box;z-index:9999;left:'+r[0]+'px;top:'+r[1]+'px;width:'+(r[2]-r[0])+'px;height:'+(r[3]-r[1])+'px';document.body.append(h);setTimeout(()=>h.remove(),4000)}});document.addEventListener('click',e=>{const a=e.target.closest('a,area');if(!a)return;e.preventDefault();parent.postMessage({cinefex:true,href:a.getAttribute('href'),fit:a.dataset.readerFit},'*')});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Escape'].includes(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();parent.postMessage({cinefex:true,key:e.key},'*')}});</script><script src="../../../page-theme.js?v=filter9"></script><script src="../../../font-source.js?v=code1"></script><script src="../../../remote-media.js?v=local1"></script></body></html>
