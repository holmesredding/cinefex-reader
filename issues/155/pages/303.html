  <script>window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.cinefexNavigate)location.replace(e.data.cinefexNavigate);if(e.data?.cinefexHighlight){const r=e.data.cinefexHighlight;let h=document.getElementById('reader-highlight');if(h)h.remove();h=document.createElement('div');h.id='reader-highlight';h.style.cssText='position:absolute;pointer-events:none;border:3px solid #a6382b;box-sizing:border-box;z-index:9999;left:'+r[0]+'px;top:'+r[1]+'px;width:'+(r[2]-r[0])+'px;height:'+(r[3]-r[1])+'px';document.body.append(h);setTimeout(()=>h.remove(),4000)}});document.addEventListener('click',e=>{const a=e.target.closest('a,area');if(!a)return;e.preventDefault();parent.postMessage({cinefex:true,href:a.getAttribute('href'),fit:a.dataset.readerFit},'*')});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Escape'].includes(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();parent.postMessage({cinefex:true,key:e.key},'*')}});</script><script src="../../../assets/js/font-source.js?v=code1"></script><script src="../../../assets/js/remote-media.js?v=pan2"></script></body></html>
